name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.19"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Install core, dashboard, video, and development dependencies
        run: uv sync --locked --extra dashboard --extra video
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Check formatting
        run: uv run --no-sync ruff format --check .
      - name: Test without game assets
        run: uv run --no-sync pytest -q -m "not atari"
      - name: Test optional SB3 recovery
        if: matrix.python == '3.12'
        run: >-
          uv run --no-sync --with stable-baselines3==2.9.2
          python -m pytest -q tests/test_sb3_reference.py
      - name: Check command-line entry point
        run: uv run --no-sync classicsrl --help
      - name: Build distributions
        run: uv build
