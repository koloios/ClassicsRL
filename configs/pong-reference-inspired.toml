# All counters below use agent transitions, not raw emulator frames.
# Experimental reference-inspired recipe; not a demonstrated Pong solution.
# Retains ClassicsRL preprocessing and evaluation; this is not an exact CleanRL reproduction.
env_id = "ALE/Pong-v5"
seed = 0
device = "auto"
total_steps = 1000000
replay_capacity = 100000
batch_size = 32
learning_starts = 80000
train_every = 4
target_update_every = 1000
learning_rate = 0.0001
gamma = 0.99
max_grad_norm = 10.0
epsilon_start = 1.0
epsilon_end = 0.01
exploration_steps = 1000000
frame_skip = 4
noop_max = 30
sticky_action_probability = 0.25
fire_on_reset = true
max_episode_steps = 27000
eval_every = 50000
eval_episodes = 5
eval_seed = 1000000
checkpoint_every = 25000
snapshot_every = 100000
log_every = 1000
